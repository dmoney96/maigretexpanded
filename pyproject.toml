[build-system]
requires = ["poetry-core>=1.7.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "maigretexpanded"
version = "0.1.0"
description = "Maigret Expanded – a maintained fork of Maigret with optional extras."
authors = ["Dominique Miller <you@example.com>"]
license = "MIT"
readme = "README.md"
packages = [
  { include = "maigret" },
  { include = "maigret_sites_example" }
]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
requests = "^2.32"
aiohttp = "^3.12"
aiodns = "^3.5"
aiohttp-socks = "^0.10.1"
PySocks = "^1.7.1"
python-socks = "^2.7"
colorama = "^0.4.6"
jinja2 = "^3.1"
pycountry = "^24.6"
cloudscraper = "^1.2.71"
alive-progress = "^3.0"
xmind = "^1.2.0"
python-dateutil = "^2.8.2"
socid-extractor = ">=0.0.27,<0.0.28"

[tool.poetry.scripts]
maigretexpanded = "maigret.cli_sync:main"
# Optionally keep the classic alias too:
# maigret = "maigret.cli_sync:main"
